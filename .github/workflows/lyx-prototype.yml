name: Experimental Generic LyX export

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    paths:
      - examples/lyx/**
      - scripts/check-lyx-export
      - .github/workflows/lyx-prototype.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 20
    steps:
      - name: Install the pinned LyX runtime and TeX dependencies on the runner
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ca-certificates git python3 lyx=2.5.2-1 lyx-common=2.5.2-1 \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export and compile one Generic fixture
        run: python3 scripts/check-lyx-export "$RUNNER_TEMP/lyx-check"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Dissertate-LyX-export-prototype
          path: ${{ runner.temp }}/lyx-check/evidence/
          if-no-files-found: error
          retention-days: 14

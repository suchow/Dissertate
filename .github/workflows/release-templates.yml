name: Release school templates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag (for example, v1.0.1)
        required: true
        type: string

      notes:
        description: What changed, in a few words
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: template-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag)
          if not match:
              raise SystemExit('Use vMAJOR.MINOR.PATCH (for example, v1.0.1).')
          notes = os.environ['RELEASE_NOTES']
          if not notes.strip() or len(notes) > 120 or len(notes.splitlines()) != 1:
              raise SystemExit('Use one short line of change notes (at most 120 characters).')
          PYCODE
      - name: Package school templates
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          packages = root / 'packages'
          packages.mkdir()
          schools = sorted(path.name for path in Path('assets/schools').iterdir() if path.is_dir() and (path / 'style.sty').is_file())
          if not schools:
              raise SystemExit('No school templates found.')
          for school in schools:
              if not (Path('assets/schools') / school / 'agent-guidance.md').is_file():
                  raise SystemExit(f'Missing agent guidance: {school}')
          (root / 'release-schools.txt').write_text('\n'.join(schools) + '\n')
          for school in schools:
              subprocess.run([sys.executable, 'scripts/package-latex', school, str(packages / f'Dissertate-{school}-LaTeX.zip')], check=True)
          PYCODE
      - name: Check release archives
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(os.environ['RUNNER_TEMP']) / 'packages'
          schools = (Path(os.environ['RUNNER_TEMP']) / 'release-schools.txt').read_text().splitlines()
          checksums = []
          for school in schools:
              archive = root / f'Dissertate-{school}-LaTeX.zip'
              prefix = archive.stem + '/'
              with ZipFile(archive) as package:
                  if package.testzip() is not None:
                      raise SystemExit(f'Corrupt archive: {archive.name}')
                  required = ['dissertation.tex', 'Dissertate.cls', 'AGENTS.md', 'frontmatter/personalize.tex']
                  if not all(prefix + path in package.namelist() for path in required):
                      raise SystemExit(f'Incomplete archive: {archive.name}')
              checksums.append(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name)
          (root / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          PYCODE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/packages/*.zip "$RUNNER_TEMP/packages/SHA256SUMS.txt" \
            --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES"
          gh release edit "$RELEASE_TAG" --draft=false --latest
